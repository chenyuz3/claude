<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OpenRouter Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-content">
                <h1>OpenRouter Chat</h1>
                <button class="settings-btn" id="settingsBtn">⚙️</button>
            </div>
        </header>

        <!-- 设置面板 -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h2>设置</h2>

                <div class="form-group">
                    <label for="apiKey">API Key:</label>
                    <input type="password" id="apiKey" placeholder="输入你的 OpenRouter API Key">
                    <button class="btn-small" id="saveApiKey">保存</button>
                </div>

                <div class="form-group">
                    <label for="modelSelect">选择模型:</label>
                    <select id="modelSelect">
                        <option value="openai/gpt-4o">GPT-4O</option>
                        <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                        <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash</option>
                        <option value="mistralai/pixtral-large-2411">Mistral Pixtral Large (Vision/OCR)</option>
                        <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
                        <option value="qwen/qwen-2.5-72b-instruct">Qwen 2.5 72B</option>
                    </select>
                    <button class="btn-small" id="addCustomModel">添加自定义模型</button>
                </div>

                <div class="form-group" id="customModelForm" style="display: none;">
                    <label for="customModelId">自定义模型 ID:</label>
                    <input type="text" id="customModelId" placeholder="例如: anthropic/claude-3-opus">
                    <button class="btn-small" id="saveCustomModel">保存模型</button>
                </div>

                <button class="btn" id="closeSettings">关闭</button>
            </div>
        </div>

        <!-- 聊天消息区域 -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>欢迎使用 OpenRouter Chat</h2>
                <p>支持多模态对话、PDF OCR 解析和 URL 内容抓取</p>
                <p>请先在设置中配置你的 API Key</p>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-container">
            <!-- 附件预览 -->
            <div class="attachments" id="attachments"></div>

            <!-- 工具栏 -->
            <div class="toolbar">
                <button class="tool-btn" id="imageBtn" title="上传图片">🖼️</button>
                <button class="tool-btn" id="pdfBtn" title="上传 PDF (OCR)">📄</button>
                <button class="tool-btn" id="urlBtn" title="抓取 URL">🔗</button>
                <button class="tool-btn" id="clearBtn" title="清空对话">🗑️</button>
            </div>

            <!-- 输入框 -->
            <div class="input-wrapper">
                <textarea
                    id="messageInput"
                    placeholder="输入消息..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn">发送</button>
            </div>

            <!-- 隐藏的文件输入 -->
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <input type="file" id="pdfInput" accept="application/pdf" style="display: none;">
        </div>

        <!-- URL 输入对话框 -->
        <div class="modal" id="urlModal">
            <div class="modal-content">
                <h3>抓取 URL 内容</h3>
                <input type="url" id="urlInput" placeholder="输入 URL...">
                <div class="modal-actions">
                    <button class="btn" id="urlOk">确定</button>
                    <button class="btn btn-secondary" id="urlCancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
